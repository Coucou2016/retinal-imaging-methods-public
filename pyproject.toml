[project]
name = "reti-pioneer"
version = "0.1.0"
description = "Methods extension of Reti-Pioneer: monotone quality routing and endpoint-aware multi-task learning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "huggingface-hub[cli]>=0.34.3",
    "imbalanced-learn>=0.13.0",
    "pytorch-ignite>=0.5.2",
    "pyyaml>=6.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.4",
    "tensorboardx>=2.6.4",
    "timm==0.9.2",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# Core scientific stack already in main deps; [core] is an explicit alias.
core = [
    "numpy",
    "scipy",
]
cuda = [
    "torch>=2.2",
    "torchvision>=0.17",
]
# Vision Mamba path (Linux wheels typically); install from PyPI when available.
mamba = [
    "causal-conv1d",
    "mamba-ssm",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
full = [
    "causal-conv1d",
    "mamba-ssm",
]

# Optional torch CUDA index helpers (no local ../../wheel paths).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cu128", extra = "cuda" },
]
