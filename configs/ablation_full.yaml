# Full follow-up stack: learnable quality + joint multi-label head + calibration eval.
# Primary utility metrics (ECE, Brier, net benefit) are printed by scripts/evaluate.py --calibrate.

data_dir: data/UKBCompressed
pretrained_dir: pretrained
ckpt_dir: ckpt

clinic_variables:
  - baselineage
  - gender
  - weight
  - ethnicity

diseases:
  - t2dm
  - thyroid
  - osteoporosis
  - gout
  - hyperlipemia
  - hypertension

pretrain_features:
  - RETF
  - SwinB
  - VimS

training:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 20
  epochs_factor: 2
  warmup_lr: 1.0e-6
  warmup_epochs: 4
  batch_size: 64
  fast_mode: true
  balance_sampler: false
  device: auto
  learnable_q: true
  multitask: true
  pos_weight: true
  enable_q: true
  quality_router: monotone
  ensemble: released_code
  masked_bce: true
  calibrate: true

eval:
  calibrate: true
  decision_threshold: 0.10
  # NB@0.10 is illustrative; prefer per-disease DCA curves in evaluate out-json.

longitudinal_years:
  - 0

split:
  val_fraction: 0.25
  cal_fraction: 0.1
  seed: 42

demo:
  n_samples: 256
  seed: 42
