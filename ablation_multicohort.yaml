# MultiCohort — ODIR+BRSET+RFMiD joint vocabulary (partial-label masked BCE).

data_dir: data/odir
pretrained_dir: pretrained
ckpt_dir: ckpt

clinic_variables: [baselineage, gender, weight, ethnicity]
diseases: [diabetes_ocular, diabetes_systemic, hypertension_ocular]
pretrain_features: [RETF, SwinB, VimS]

training:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 20
  epochs_factor: 2
  warmup_lr: 1.0e-6
  warmup_epochs: 4
  batch_size: 64
  fast_mode: true
  balance_sampler: false
  device: auto
  learnable_q: true
  quality_router: monotone
  multitask: true
  masked_bce: true
  pos_weight: true
  enable_q: true
  ensemble: released_code
  quality_gating: false
  lambda_q: 0.0
  calibrate: true

eval:
  calibrate: true
  decision_threshold: 0.10
  paper_mode: false

longitudinal_years: [0]
split:
  val_fraction: 0.25
  cal_fraction: 0.1
  test_fraction: 0.2
  seed: 42
demo:
  n_samples: 64
  seed: 42

multi_cohort:
  dirs:
    odir: data/odir
    brset: data/brset
    rfmid: data/rfmid
